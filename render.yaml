services:
  # Python Backend
  - type: web
    name: collegebot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # Set this in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: LOCAL_DEV
        value: "false"

  # Static Frontend (Vite)
  - type: web
    name: collegebot-frontend
    runtime: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        src: /api/*
        dest: https://collegebot-backend.onrender.com/api/* # Replace with your actual backend URL after first deploy
      - type: rewrite
        src: /*
        dest: /index.html
